<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2818"/>
      <stop offset="50%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="30%" stop-color="#52b788"/>
      <stop offset="70%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b7e4c7"/>
      <stop offset="40%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="veinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
    </linearGradient>
    <filter id="leafShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0a1a0e" flood-opacity="0.3"/>
    </filter>
    <radialGradient id="glow" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Subtle background texture circles -->
  <circle cx="100" cy="420" r="140" fill="rgba(255,255,255,0.03)"/>
  <circle cx="420" cy="100" r="100" fill="rgba(255,255,255,0.03)"/>
  <circle cx="380" cy="380" r="80" fill="rgba(255,255,255,0.02)"/>

  <g filter="url(#leafShadow)">
    <!-- Main leaf shape - slightly rotated -->
    <g transform="translate(256,250) rotate(-5)">
      <!-- Leaf body -->
      <path d="M0,-170 
               C45,-170 95,-130 110,-90 
               C125,-50 130,10 120,70 
               C110,130 80,175 0,195 
               C-80,175 -110,130 -120,70 
               C-130,10 -125,-50 -110,-90 
               C-95,-130 -45,-170 0,-170 Z" 
            fill="url(#leafGrad)"/>

      <!-- Second overlapping leaf -->
      <path d="M0,-155 
               C50,-155 105,-110 120,-65 
               C135,-20 130,35 105,90 
               C80,145 35,175 0,185 
               C-35,175 -80,145 -105,90 
               C-130,35 -135,-20 -120,-65 
               C-105,-110 -50,-155 0,-155 Z" 
            fill="url(#leafGrad2)" opacity="0.85"/>

      <!-- Center vein -->
      <path d="M0,-145 C0,-90 0,20 0,170" 
            stroke="url(#veinGrad)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Left veins -->
      <path d="M0,-90 C-30,-95 -55,-75 -70,-55" 
            stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M0,-40 C-30,-45 -60,-25 -78,0" 
            stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M0,10 C-28,5 -58,22 -72,48" 
            stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M0,60 C-25,58 -48,72 -58,95" 
            stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M0,105 C-18,105 -35,118 -42,140" 
            stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Right veins -->
      <path d="M0,-90 C30,-95 55,-75 70,-55" 
            stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M0,-40 C30,-45 60,-25 78,0" 
            stroke="rgba(255,255,255,0.25)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M0,10 C28,5 58,22 72,48" 
            stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M0,60 C25,58 48,72 58,95" 
            stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M0,105 C18,105 35,118 42,140" 
            stroke="rgba(255,255,255,0.18)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

      <!-- Leaf stem -->
      <path d="M0,180 C0,200 2,210 0,225" 
            stroke="#2d6a4f" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Glow overlay -->
  <rect width="512" height="512" rx="120" fill="url(#glow)"/>
</svg>
